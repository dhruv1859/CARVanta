# ═══════════════════════════════════════════════════════════════════════════════
# CARVanta — Release Workflow
# ═══════════════════════════════════════════════════════════════════════════════
# Publishes a GitHub Release when a version tag is pushed.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Build Frontend
        working-directory: frontend-react
        run: |
          npm ci
          npx vite build

      - name: Package Frontend Dist
        run: tar -czf carvanta-frontend-${{ github.ref_name }}.tar.gz -C frontend-react/dist .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            carvanta-frontend-${{ github.ref_name }}.tar.gz
          body: |
            ## CARVanta ${{ github.ref_name }}

            AI-Augmented Biomarker Intelligence Platform for CAR-T Cell Target Discovery.

            ### Artifacts
            - `carvanta-frontend-${{ github.ref_name }}.tar.gz` — Production React build

            ### Quick Start
            ```bash
            pip install -r requirements.txt
            uvicorn api.main:app --port 8001
            cd frontend-react && npm install && npm run dev
            ```
