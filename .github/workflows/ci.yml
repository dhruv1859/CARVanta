# ═══════════════════════════════════════════════════════════════════════════════
# CARVanta CI — Continuous Integration
# ═══════════════════════════════════════════════════════════════════════════════
# Full-stack CI: Python lint + test, React typecheck + lint + build, security.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Python Lint ──────────────────────────────────────────────────────────
  python-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # ── Frontend TypeCheck + Lint + Build ────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - name: TypeScript Type Check
        run: npx tsc --noEmit
        continue-on-error: true
      - name: ESLint
        run: npm run lint
        continue-on-error: true
      - name: Production Build
        run: npx vite build

  # ── Security Scan ──────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip install -r requirements.txt
      - run: pip-audit
        continue-on-error: true

  # ── Python Tests ────────────────────────────────────────────────────────
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [python-lint]
    env:
      ENVIRONMENT: testing
      DATABASE_URL: sqlite:///test_carvanta.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - run: python -m pytest --tb=short --cov=. --cov-report=term-missing -q
        continue-on-error: true

  # ── Docker Build Check ─────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python-lint, frontend, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t carvanta-api:ci .
      - name: Build Frontend image
        run: docker build -t carvanta-frontend:ci -f Dockerfile.frontend .
